<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Cyan Glow for Nodes -->
    <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#002B99" />
    </linearGradient>

    <linearGradient id="lock-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Background is transparent, no rect background added -->

  <!-- Outer Shield Glow -->
  <path d="M 300,50 C 400,50 460,75 460,145 C 460,280 400,380 300,450 C 200,380 140,280 140,145 C 140,75 200,50 300,50 Z" 
        fill="none" 
        stroke="#00F0FF" 
        stroke-width="3" 
        opacity="0.4" 
        filter="url(#cyan-glow)" />

  <!-- Main Outer Shield -->
  <path d="M 300,60 C 390,60 445,82 445,148 C 445,270 390,365 300,430 C 210,365 155,270 155,148 C 155,82 210,60 300,60 Z" 
        fill="none" 
        stroke="url(#shield-grad)" 
        stroke-width="8" 
        stroke-linejoin="round" 
        filter="url(#cyan-glow)" />

  <!-- Inner Shield Accent -->
  <path d="M 300,85 C 370,85 415,103 415,155 C 415,255 370,340 300,400 C 230,340 185,255 185,155 C 185,103 230,85 300,85 Z" 
        fill="none" 
        stroke="#0052FF" 
        stroke-width="3" 
        stroke-dasharray="15, 8, 5, 8" 
        opacity="0.8" />

  <!-- Circuitry Traces Inside Shield -->
  <!-- Left Circuit -->
  <path d="M 210,155 H 245 L 265,175 V 225" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />
  <path d="M 200,210 H 225 L 240,225 V 270" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6" />
  <path d="M 215,280 H 235 L 250,295 V 320" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6" />

  <!-- Right Circuit -->
  <path d="M 390,155 H 355 L 335,175 V 225" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />
  <path d="M 400,210 H 375 L 360,225 V 270" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6" />
  <path d="M 385,280 H 365 L 350,295 V 320" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6" />

  <!-- Bottom Circuit -->
  <path d="M 300,375 V 345" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />

  <!-- Circuit Nodes (Glow Dots) -->
  <circle cx="210" cy="155" r="5" fill="#00F0FF" filter="url(#strong-glow)" />
  <circle cx="200" cy="210" r="4" fill="#00F0FF" filter="url(#cyan-glow)" />
  <circle cx="215" cy="280" r="4" fill="#00F0FF" filter="url(#cyan-glow)" />
  
  <circle cx="390" cy="155" r="5" fill="#00F0FF" filter="url(#strong-glow)" />
  <circle cx="400" cy="210" r="4" fill="#00F0FF" filter="url(#cyan-glow)" />
  <circle cx="385" cy="280" r="4" fill="#00F0FF" filter="url(#cyan-glow)" />

  <circle cx="300" cy="345" r="5" fill="#00F0FF" filter="url(#strong-glow)" />

  <!-- Padlock Graphic -->
  <g transform="translate(0, 10)" filter="url(#cyan-glow)">
    <!-- Shackle -->
    <path d="M 255,210 V 175 C 255,150 275,130 300,130 C 325,130 345,150 345,175 V 210" 
          fill="none" 
          stroke="url(#lock-grad)" 
          stroke-width="10" 
          stroke-linecap="round" />
    
    <!-- Shackle Inner Detail -->
    <path d="M 265,210 V 175 C 265,155 280,140 300,140 C 320,140 335,155 335,175 V 210" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.8" />

    <!-- Lock Body -->
    <rect x="240" y="210" width="120" height="90" rx="15" fill="url(#lock-grad)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Lock Body Highlight Grid -->
    <path d="M 255,225 H 345 M 255,255 H 345 M 255,285 H 345" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

    <!-- Keyhole -->
    <circle cx="300" cy="245" r="10" fill="#0c101b" />
    <path d="M 295,252 L 305,252 L 308,275 L 292,275 Z" fill="#0c101b" />
  </g>

  <!-- Title Text -->
  <text x="300" y="525" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="8" 
        fill="url(#text-grad)" 
        filter="url(#cyan-glow)">CYBERSECURITY</text>

  <!-- Subtitle Text -->
  <text x="300" y="555" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#00F0FF" 
        opacity="0.8" 
        filter="url(#cyan-glow)">PROTECTION &amp; INTEGRITY</text>
</svg>
